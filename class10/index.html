<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="2" bordercolor="black" bgcolor="lightgrey">
    <form action="./welcome.html">
        <tr>
            <td>Enter Your Name</td>
            <td><input required="text" name="" id=""></td>
        </tr>
        <tr>
            <td>Enter Your Last Name</td>
            <td><input type="text" name="" id=""></td>
        </tr>
         <tr>
            <td>Enter Your Password</td>
            <td><input type="number" name="" id=""></td>
        </tr>
         <tr>
            <td>ReEnter Your Password</td>
            <td><input type="number" name="" id=""></td>
        </tr>
         <tr>
            <td>Enter Your Email</td>
            <td><input type="email" name="" id=""></td>
        </tr>
         <tr>
            <td>Enter Your Phone Number</td>
            <td><input type="number" name="" id=""></td>
        </tr>
         <tr>
            <td>Enter Your Address</td>
            <td><textarea name="" id="" rows="5" cols="5"></textarea></td>
        </tr>
        <tr>
            <td>Enter Your Gender</td>
            <td>
                <input type="radio" name="gender" id="">Male
                <input type="radio" name="gender" id="">Female
            </td>
        </tr>
        <tr>
            <td>Enter Your Hobbies</td>
            <td>
                <input type="checkbox" name="hobbies" id="">Reading
                <input type="checkbox" name="hobbies" id="">Writing
                <input type="checkbox" name="hobbies" id="">Coding
            </td>
        </tr>
        <tr>
            <td>Enter Your DOB</td>
            <td><input type="date" name="" id=""></td>
        </tr>
        <tr>
            <td>Enter Your Country</td>
            <td>
                <select name="" id="">
                    <option value="" disabled selected>Select a country</option>
                    <option value="">Pakistan</option>
                    <option value="">India</option>
                    <option value="">USA</option>
                    <option value="">UK</option>
                    <option value="">Canada</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>Upload Your Photo</td>
            <td><input type="file" name="" id=""></td>
        </tr>
        <tr align="center">
            <td colspan="2">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </td>
        </tr>
    </form>
    </table>
</body>
</html>
